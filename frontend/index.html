<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARPulse</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-800 p-6 max-w-6xl mx-auto">
<header class="flex items-center justify-between mb-6"><h1 class="text-2xl font-bold">ARPulse <span class="text-teal-700 text-sm font-semibold">Receivables</span></h1>
<div class="flex items-center gap-3"><span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-200">checking…</span>
<button id="refresh" class="px-3 py-1.5 rounded bg-slate-900 text-white text-sm">Refresh</button></div></header>
<div id="err" class="hidden mb-4 p-3 rounded bg-red-100 text-red-800 text-sm"></div>
<section id="kpis" class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6"></section>
<div class="grid lg:grid-cols-2 gap-6 mb-6">
<div class="bg-white rounded-xl p-4 shadow-sm"><h2 class="font-semibold mb-3">Aging</h2><div id="aging" class="space-y-3"></div></div>
<div class="bg-white rounded-xl p-4 shadow-sm"><h2 class="font-semibold mb-3">Top debtors</h2><table class="w-full text-sm"><tbody id="debtors"></tbody></table></div></div>
<section class="bg-white rounded-xl p-4 shadow-sm"><div class="flex flex-wrap gap-2 mb-3">
<input id="q" placeholder="Search invoice / customer" class="border rounded px-3 py-1.5 text-sm flex-1">
<select id="bucket" class="border rounded px-2 text-sm"><option value="">All buckets</option><option>current</option><option>1-30</option><option>31-60</option><option>61-90</option><option>90+</option></select>
<select id="tpl" class="border rounded px-2 text-sm"><option value="friendly">Friendly</option><option value="firm">Firm</option><option value="final">Final notice</option></select></div>
<table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th>Invoice</th><th>Customer</th><th>Due</th><th>Overdue</th><th class="text-right">Amount</th><th>Risk</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div class="flex justify-between mt-3 text-sm"><span id="count"></span><span><button id="prev" class="px-2">‹</button><span id="pg"></span><button id="next" class="px-2">›</button></span></div></section>
<div id="toast" class="fixed bottom-4 right-4 hidden px-4 py-2 rounded bg-slate-900 text-white text-sm"></div>
<script>
const $=s=>document.querySelector(s),money=(n,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(n);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const RISK={low:'bg-teal-100 text-teal-800',medium:'bg-slate-200',high:'bg-red-100 text-red-800',critical:'bg-red-600 text-white'};let page=1,total=0;
async function api(p,o){const r=await fetch(p,o),j=await r.json();if(!r.ok)throw new Error(j.error?.message||j.detail||r.status);return j}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
function fail(e){const b=$('#err');b.textContent=e.message;b.classList.remove('hidden')}
async function loadDash(refresh){try{$('#err').classList.add('hidden');const d=await api('/api/dashboard'+(refresh?'?refresh=true':''));
if(d.unconverted_count)throw new Error(d.unconverted_count+' invoice(s) use an unsupported currency');
const companyMoney=n=>d.mixed_currency?Number(n).toLocaleString()+' (mixed currencies)':money(n,d.currency||'USD');
const k=[['Total receivable',companyMoney(d.total_receivable)],['Overdue',companyMoney(d.total_overdue)],['Overdue %',d.overdue_pct+'%'],['DSO',d.dso==null?'–':d.dso+' d'],['Open invoices',d.open_count]];
$('#kpis').innerHTML=k.map(([a,b])=>`<div class="bg-white rounded-xl p-4 shadow-sm"><div class="text-xs uppercase text-slate-500">${a}</div><div class="text-2xl font-bold">${b}</div></div>`).join('');
const mx=Math.max(...d.aging.map(a=>a.amount),1);$('#aging').innerHTML=d.aging.map(a=>`<div><div class="flex justify-between text-sm"><span>${a.label} · ${a.count} inv</span><b>${companyMoney(a.amount)}</b></div><div class="h-3 bg-slate-100 rounded"><div class="h-3 rounded ${a.key=='90+'?'bg-red-600':'bg-teal-600'}" style="width:${a.amount/mx*100}%"></div></div></div>`).join('');
$('#debtors').innerHTML=d.top_debtors.map(x=>`<tr class="border-t"><td class="py-2">${esc(x.customer)}</td><td class="text-right text-red-700 font-semibold">${companyMoney(x.overdue)}</td><td class="text-center"><span class="px-2 rounded-full text-xs ${RISK[x.risk]}">${esc(x.risk)}</span></td></tr>`).join('')}catch(e){fail(e)}}
async function loadRows(){try{const p=new URLSearchParams({page,q:$('#q').value,bucket:$('#bucket').value}),d=await api('/api/invoices?'+p);total=d.total;
$('#rows').innerHTML=d.items.map(i=>`<tr class="border-t"><td class="py-2 font-medium">${esc(i.number)}</td><td>${esc(i.customer)}</td><td>${esc(i.due)}</td><td>${i.days_overdue?i.days_overdue+' d':'Current'}</td><td class="text-right"><div>${money(i.amount,i.currency)}</div>${i.currency!==i.reporting_currency?'<div class="text-xs text-slate-500">≈ '+money(i.amount_reporting,i.reporting_currency)+'</div>':''}</td><td><span class="px-2 rounded-full text-xs ${RISK[i.risk]}">${esc(i.risk)}</span></td><td class="text-right"><button data-id="${i.id}" class="rem px-2 py-1 rounded bg-teal-700 text-white text-xs">Log follow-up</button></td></tr>`).join('');
$('#count').textContent=`${total} invoices`;$('#pg').textContent=`${page}`}catch(e){fail(e)}}
document.addEventListener('click',async e=>{const b=e.target.closest('.rem');if(!b)return;b.disabled=true;
try{const r=await api(`/api/invoices/${b.dataset.id}/reminder`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template:$('#tpl').value})});toast('Odoo note and activity created · due '+r.deadline)}catch(x){toast(x.message)}b.disabled=false});
$('#refresh').onclick=()=>{loadDash(true);loadRows()};$('#q').oninput=()=>{page=1;loadRows()};$('#bucket').onchange=()=>{page=1;loadRows()};
$('#prev').onclick=()=>{if(page>1){page--;loadRows()}};$('#next').onclick=()=>{if(page*15<total){page++;loadRows()}};
api('/api/status').then(s=>{const e=$('#status');e.textContent=s.mode==='mock'?'Demo data · mock mode':s.connected?'Odoo connected · live':'Odoo not connected';e.className='text-xs px-2 py-1 rounded-full '+(s.mode==='mock'?'bg-amber-100 text-amber-800':s.connected?'bg-teal-100 text-teal-800':'bg-red-100 text-red-800')});
loadDash();loadRows();
</script></body></html>
